name: Hyperliquid ASXN History collector

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "rolling or separately approved seed"
        required: true
        default: rolling
        type: choice
        options: [rolling, seed]
      seed_from:
        description: "YYYY-MM-DD; seed only; coordinator enforces exact approved range"
        required: false
        type: string
      seed_to:
        description: "YYYY-MM-DD; seed only; coordinator enforces exact approved range"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: hyperliquid-asxn-history-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && vars.HL_HISTORY_EXECUTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HL_HISTORY_INGEST_ORIGIN: ${{ vars.HL_HISTORY_INGEST_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded collector dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Static compile
        run: python -m compileall -q collector tests
      - name: Synthetic contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Collect and deliver bounded Hyperliquid History
        shell: bash
        run: |
          set -Eeuo pipefail
          args=(--mode "${{ inputs.mode }}")
          if [[ "${{ inputs.mode }}" == "seed" ]]; then
            args+=(--seed-from "${{ inputs.seed_from }}" --seed-to "${{ inputs.seed_to }}")
          fi
          python -m collector.history_collector "${args[@]}"
