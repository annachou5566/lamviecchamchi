name: Hyperliquid ASXN History collector

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "rolling, separately approved seed, or OIDC qualification only"
        required: true
        default: rolling
        type: choice
        options: [rolling, seed, oidc-qualification]
      seed_from:
        description: "YYYY-MM-DD; seed only; coordinator enforces exact approved range"
        required: false
        type: string
      seed_to:
        description: "YYYY-MM-DD; seed only; coordinator enforces exact approved range"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: hyperliquid-asxn-history-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && inputs.mode != 'oidc-qualification' && vars.HL_HISTORY_EXECUTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HL_HISTORY_INGEST_ORIGIN: ${{ vars.HL_HISTORY_INGEST_ORIGIN }}
      HL_MODE: ${{ inputs.mode }}
      HL_SEED_FROM: ${{ inputs.seed_from }}
      HL_SEED_TO: ${{ inputs.seed_to }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded collector dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Static compile
        run: python -m compileall -q collector tests
      - name: Synthetic contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Collect and deliver bounded Hyperliquid History
        shell: bash
        run: |
          set -Eeuo pipefail
          args=(--mode "$HL_MODE")
          if [[ "$HL_MODE" == "seed" ]]; then
            args+=(--seed-from "$HL_SEED_FROM" --seed-to "$HL_SEED_TO")
          fi
          python -m collector.history_collector "${args[@]}"

  oidc-qualification:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'oidc-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HL_OIDC_QUALIFICATION_ORIGIN: ${{ vars.HL_OIDC_QUALIFICATION_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static compile qualification client
        run: python -m py_compile collector/oidc_qualification.py
      - name: Synthetic qualification tests
        run: python -m unittest discover -s tests -p 'test_oidc_qualification.py' -v
      - name: Request and verify exact GitHub OIDC identity
        run: python collector/oidc_qualification.py
